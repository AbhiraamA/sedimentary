[package]
name = "sedimentary"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A virtual pet rock that is deeply unimpressed with you."
license = "MIT"
readme = "README.md"

[dependencies]
dirs = "7"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
